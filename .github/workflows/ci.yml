name: Syntax and isolated Worker regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cp wrangler.jsonc.example wrangler.jsonc
      - run: npm run check
      - run: npm run lint
      - run: npm test
